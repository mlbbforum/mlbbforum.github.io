<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin MLBB Forum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="w-full max-w-md bg-[#131b2e] border border-gray-800 p-6 rounded-2xl shadow-xl mt-12">
    <div class="text-center mb-6">
      <span class="text-3xl">🔐</span>
      <h1 class="text-xl font-black text-yellow-500 mt-2">LOGIN ADMIN FORUM</h1>
      <p class="text-xs text-gray-400 mt-1">Otorisasi via GitHub Personal Access Token</p>
    </div>
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">GitHub Username / Owner</label>
        <input type="text" id="cfgOwner" required placeholder="Contoh: username-kamu" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-yellow-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Nama Repository</label>
        <input type="text" id="cfgRepo" required placeholder="Contoh: forum-mlbb" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-yellow-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">GitHub Personal Access Token (classic / fine-grained)</label>
        <input type="password" id="cfgToken" required placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-yellow-500">
        <p class="text-[11px] text-gray-500 mt-1">Token hanya disimpan lokal di browsermu.</p>
      </div>
      <button type="submit" class="w-full py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-lg text-sm transition">
        Masuk ke Dashboard
      </button>
    </form>
  </div>

  <!-- DASHBOARD SECTION (Muncul setelah login) -->
  <div id="dashboardSection" class="hidden w-full max-w-4xl space-y-6">
    <!-- TOP BAR -->
    <div class="flex justify-between items-center bg-[#131b2e] p-4 rounded-xl border border-gray-800">
      <div>
        <h2 class="font-bold text-yellow-500 text-lg">🛡️ Dashboard Admin MLBB</h2>
        <span id="repoBadge" class="text-xs text-gray-400"></span>
      </div>
      <div class="flex gap-2">
        <a href="index.html" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg font-semibold">Lihat Forum ↗</a>
        <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-900/60 hover:bg-red-800 text-red-200 text-xs rounded-lg font-semibold">Keluar</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- FORM TAMBAH THREAD -->
      <div class="md:col-span-2 bg-[#131b2e] p-6 rounded-xl border border-gray-800">
        <h3 class="font-bold text-white mb-4 text-base">Buat Thread / Topik Baru</h3>
        <form onsubmit="handleCreateThread(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Kategori Sub-Forum</label>
            <select id="postCategory" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:border-yellow-500">
              <option value="meta|Meta & Patch">🛡️ Diskusi Meta & Patch</option>
              <option value="mabar|Cari Teman">🎮 Cari Teman / Mabar</option>
              <option value="build|Build & Item">🗡️ Build Item & Hero</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Judul Thread</label>
            <input type="text" id="postTitle" required placeholder="Contoh: [Mabar] Butuh Roamer Mythic Glory" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:border-yellow-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Nama Pembuat (Author)</label>
            <input type="text" id="postAuthor" required placeholder="Contoh: Admin MLBB" class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:border-yellow-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Isi Pembuka Diskusi (Konten)</label>
            <textarea id="postContent" rows="5" required placeholder="Tuliskan isi topik diskusi di sini..." class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-sm text-white focus:border-yellow-500"></textarea>
          </div>
          <button type="submit" id="btnSubmit" class="w-full py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-lg text-sm transition">
            🚀 Terbitkan Thread ke GitHub
          </button>
        </form>
      </div>

      <!-- LIST THREAD YANG ADA -->
      <div class="bg-[#131b2e] p-6 rounded-xl border border-gray-800">
        <h3 class="font-bold text-white mb-4 text-base">Thread Aktif (<span id="threadCount">0</span>)</h3>
        <div id="threadListAdmin" class="space-y-3 max-h-[500px] overflow-y-auto text-xs text-gray-300 pr-1">
          Memuat...
        </div>
      </div>
    </div>
  </div>

  <script>
    // FUNGSI ENCODE/DECODE UTF-8 AMAN UNTUK BASE64 GITHUB
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    function base64ToUtf8(base64) {
      const binary = atob(base64.replace(/\n/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    let authConfig = JSON.parse(localStorage.getItem('mlbb_admin_auth') || 'null');
    let currentSha = '';
    let currentThreads = [];

    window.onload = () => {
      if (authConfig) {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      authConfig = {
        owner: document.getElementById('cfgOwner').value.trim(),
        repo: document.getElementById('cfgRepo').value.trim(),
        token: document.getElementById('cfgToken').value.trim()
      };
      localStorage.setItem('mlbb_admin_auth', JSON.stringify(authConfig));
      showDashboard();
    }

    function handleLogout() {
      localStorage.removeItem('mlbb_admin_auth');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('repoBadge').innerText = `Repo: ${authConfig.owner}/${authConfig.repo}`;
      loadThreadsFromGitHub();
    }

    // AMBIL DATA threads.json DARI GITHUB API
    async function loadThreadsFromGitHub() {
      const listContainer = document.getElementById('threadListAdmin');
      listContainer.innerHTML = 'Memuat thread...';

      try {
        const res = await fetch(`https://api.github.com/repos/${authConfig.owner}/${authConfig.repo}/contents/threads.json`, {
          headers: { 'Authorization': `Bearer ${authConfig.token}` }
        });
        if (!res.ok) throw new Error('Gagal mengambil data. Pastikan Token, Owner, dan Nama Repo benar!');

        const data = await res.json();
        currentSha = data.sha;
        currentThreads = JSON.parse(base64ToUtf8(data.content));
        
        document.getElementById('threadCount').innerText = currentThreads.length;
        renderAdminList();
      } catch (err) {
        alert(err.message);
        handleLogout();
      }
    }

    function renderAdminList() {
      const listContainer = document.getElementById('threadListAdmin');
      listContainer.innerHTML = '';

      currentThreads.forEach((t, index) => {
        const item = document.createElement('div');
        item.className = "p-3 bg-[#0b0f19] rounded-lg border border-gray-800 flex justify-between items-start gap-2";
        item.innerHTML = `
          <div>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-yellow-600/20 text-yellow-400 uppercase font-semibold">${t.categoryName}</span>
            <p class="font-bold text-gray-200 mt-1 line-clamp-1">${t.title}</p>
            <span class="text-[10px] text-gray-500">${t.author} • ${t.date}</span>
          </div>
          <button onclick="deleteThread(${index})" class="text-red-400 hover:text-red-300 font-bold px-1 text-sm">✕</button>
        `;
        listContainer.appendChild(item);
      });
    }

    // TERBITKAN THREAD BARU (COMMIT OTOMATIS KE GITHUB)
    async function handleCreateThread(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Menyimpan ke GitHub...';
      btn.disabled = true;

      const [catId, catName] = document.getElementById('postCategory').value.split('|');
      const title = document.getElementById('postTitle').value.trim();
      const author = document.getElementById('postAuthor').value.trim();
      const content = document.getElementById('postContent').value.trim();

      const newThread = {
        id: 't-' + Date.now(),
        category: catId,
        categoryName: catName,
        title: title,
        author: author,
        date: new Date().toISOString().split('T')[0],
        content: content
      };

      currentThreads.unshift(newThread); // Tambah ke paling atas

      await pushToGitHub(`Tambah Thread: ${title}`);
      
      // Reset form
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      btn.innerText = '🚀 Terbitkan Thread ke GitHub';
      btn.disabled = false;
    }

    // HAPUS THREAD
    async function deleteThread(index) {
      if (!confirm(`Hapus thread "${currentThreads[index].title}"?`)) return;
      currentThreads.splice(index, 1);
      await pushToGitHub(`Hapus thread indeks ${index}`);
    }

    // FUNGSI UTAMA PUSH KE REPO GITHUB
    async function pushToGitHub(commitMsg) {
      try {
        const updatedContentBase64 = utf8ToBase64(JSON.stringify(currentThreads, null, 2));

        const res = await fetch(`https://api.github.com/repos/${authConfig.owner}/${authConfig.repo}/contents/threads.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${authConfig.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: commitMsg,
            content: updatedContentBase64,
            sha: currentSha
          })
        });

        if (!res.ok) throw new Error('Gagal menyimpan ke GitHub.');

        const resData = await res.json();
        currentSha = resData.content.sha;
        alert('✅ Berhasil disimpan ke GitHub Pages!');
        renderAdminList();
      } catch (err) {
        alert('Gagal update: ' + err.message);
      }
    }
  </script>
</body>
</html>
